<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img">
<title>What-if engine</title>
<style>
  text { font-family: -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif; fill: #e6edf7; }
  .mono { font-family: ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
  .muted { fill: #8da2c0; }
  .dim { fill: #5b6b88; }
</style>
<defs><linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#131c35"/></linearGradient></defs>
<rect width="960" height="600" rx="18" fill="url(#bgGrad)"/>
<text x="24" y="40" font-size="20" font-weight="800">What-if engine: 13 one-feature changes, re-scored by the same model</text>
<text x="24" y="62" font-size="13" class="muted">Default form values (46.7th percentile). Each candidate flips one feature, the percentile is recomputed, gains above 0.5 pp are kept, top 6 shown.</text>
<line x1="393.8" y1="88" x2="393.8" y2="503" stroke="#38bdf8" stroke-dasharray="4 4"/>
<text x="393.8" y="82" font-size="11.5" text-anchor="middle" style="fill:#38bdf8">current 46.7</text>
<text x="300.0" y="519" font-size="11" text-anchor="middle" class="mono muted">40</text>
<text x="440.0" y="519" font-size="11" text-anchor="middle" class="mono muted">50</text>
<text x="580.0" y="519" font-size="11" text-anchor="middle" class="mono muted">60</text>
<text x="720.0" y="519" font-size="11" text-anchor="middle" class="mono muted">70</text>
<text x="24" y="115" font-size="13" >Target multiplayer audience</text>
<rect x="393.8" y="103" width="0" height="16" rx="3" fill="#34d399"><animate attributeName="width" values="0;0;267.5;267.5;0" keyTimes="0;0.033;0.083;0.93;1" dur="12s" repeatCount="indefinite"/></rect>
<text x="669.3" y="115" font-size="11.5" class="mono ">+19.1 pp to 65.8</text>
<rect x="850" y="101" width="80" height="20" rx="10" fill="none" stroke="#34d399" stroke-opacity="1"/><text x="890" y="115" font-size="11.5" text-anchor="middle" style="fill:#34d399" opacity="1">High</text>
<text x="24" y="146" font-size="13" >Add Steam Trading Cards</text>
<rect x="393.8" y="134" width="0" height="16" rx="3" fill="#34d399"><animate attributeName="width" values="0;0;191.8;191.8;0" keyTimes="0;0.062;0.113;0.93;1" dur="12s" repeatCount="indefinite"/></rect>
<text x="593.6" y="146" font-size="11.5" class="mono ">+13.7 pp to 60.4</text>
<rect x="850" y="132" width="80" height="20" rx="10" fill="none" stroke="#34d399" stroke-opacity="1"/><text x="890" y="146" font-size="11.5" text-anchor="middle" style="fill:#34d399" opacity="1">High</text>
<text x="24" y="177" font-size="13" >Emphasize story elements</text>
<rect x="393.8" y="165" width="0" height="16" rx="3" fill="#34d399"><animate attributeName="width" values="0;0;135.0;135.0;0" keyTimes="0;0.092;0.142;0.93;1" dur="12s" repeatCount="indefinite"/></rect>
<text x="536.8" y="177" font-size="11.5" class="mono ">+9.6 pp to 56.3</text>
<rect x="850" y="163" width="80" height="20" rx="10" fill="none" stroke="#fbbf24" stroke-opacity="1"/><text x="890" y="177" font-size="11.5" text-anchor="middle" style="fill:#fbbf24" opacity="1">Medium</text>
<text x="24" y="208" font-size="13" >Add Steam Workshop support</text>
<rect x="393.8" y="196" width="0" height="16" rx="3" fill="#34d399"><animate attributeName="width" values="0;0;125.2;125.2;0" keyTimes="0;0.121;0.171;0.93;1" dur="12s" repeatCount="indefinite"/></rect>
<text x="527.0" y="208" font-size="11.5" class="mono ">+8.9 pp to 55.6</text>
<rect x="850" y="194" width="80" height="20" rx="10" fill="none" stroke="#fbbf24" stroke-opacity="1"/><text x="890" y="208" font-size="11.5" text-anchor="middle" style="fill:#fbbf24" opacity="1">Medium</text>
<text x="24" y="239" font-size="13" >Add Mac &amp; Linux support</text>
<rect x="393.8" y="227" width="0" height="16" rx="3" fill="#34d399"><animate attributeName="width" values="0;0;96.2;96.2;0" keyTimes="0;0.150;0.200;0.93;1" dur="12s" repeatCount="indefinite"/></rect>
<text x="498.0" y="239" font-size="11.5" class="mono ">+6.9 pp to 53.6</text>
<rect x="850" y="225" width="80" height="20" rx="10" fill="none" stroke="#fbbf24" stroke-opacity="1"/><text x="890" y="239" font-size="11.5" text-anchor="middle" style="fill:#fbbf24" opacity="1">Medium</text>
<text x="24" y="270" font-size="13" >Add full controller support</text>
<rect x="393.8" y="258" width="0" height="16" rx="3" fill="#34d399"><animate attributeName="width" values="0;0;54.6;54.6;0" keyTimes="0;0.179;0.229;0.93;1" dur="12s" repeatCount="indefinite"/></rect>
<text x="456.4" y="270" font-size="11.5" class="mono ">+3.9 pp to 50.6</text>
<rect x="850" y="256" width="80" height="20" rx="10" fill="none" stroke="#fbbf24" stroke-opacity="1"/><text x="890" y="270" font-size="11.5" text-anchor="middle" style="fill:#fbbf24" opacity="1">Medium</text>
<text x="24" y="301" font-size="13" class="muted">Add co-op mode</text>
<rect x="393.8" y="289" width="0" height="16" rx="3" fill="#5b6b88"><animate attributeName="width" values="0;0;44.0;44.0;0" keyTimes="0;0.208;0.258;0.93;1" dur="12s" repeatCount="indefinite"/></rect>
<text x="445.8" y="301" font-size="11.5" class="mono dim">+3.1 pp to 49.8</text>
<rect x="850" y="287" width="80" height="20" rx="10" fill="none" stroke="#fbbf24" stroke-opacity="0.4"/><text x="890" y="301" font-size="11.5" text-anchor="middle" style="fill:#fbbf24" opacity="0.5">Medium</text>
<text x="254" y="301" font-size="10.5" class="dim">beyond top 6</text>
<text x="24" y="332" font-size="13" class="muted">Target co-op audience</text>
<rect x="393.8" y="320" width="0" height="16" rx="3" fill="#5b6b88"><animate attributeName="width" values="0;0;21.7;21.7;0" keyTimes="0;0.237;0.287;0.93;1" dur="12s" repeatCount="indefinite"/></rect>
<text x="423.5" y="332" font-size="11.5" class="mono dim">+1.6 pp to 48.2</text>
<rect x="850" y="318" width="80" height="20" rx="10" fill="none" stroke="#fbbf24" stroke-opacity="0.4"/><text x="890" y="332" font-size="11.5" text-anchor="middle" style="fill:#fbbf24" opacity="0.5">Medium</text>
<text x="254" y="332" font-size="10.5" class="dim">beyond top 6</text>
<text x="24" y="363" font-size="13" class="muted">Add Steam Cloud saves</text>
<rect x="393.8" y="351" width="0" height="16" rx="3" fill="#5b6b88"><animate attributeName="width" values="0;0;14.7;14.7;0" keyTimes="0;0.267;0.317;0.93;1" dur="12s" repeatCount="indefinite"/></rect>
<text x="416.5" y="363" font-size="11.5" class="mono dim">+1.1 pp to 47.8</text>
<rect x="850" y="349" width="80" height="20" rx="10" fill="none" stroke="#f87171" stroke-opacity="0.4"/><text x="890" y="363" font-size="11.5" text-anchor="middle" style="fill:#f87171" opacity="0.5">Low</text>
<text x="254" y="363" font-size="10.5" class="dim">beyond top 6</text>
<text x="24" y="394" font-size="13" class="muted">Add multiplayer mode</text>
<rect x="393.8" y="382" width="0" height="16" rx="3" fill="#24324f"><animate attributeName="width" values="0;0;1.8;1.8;0" keyTimes="0;0.296;0.346;0.93;1" dur="12s" repeatCount="indefinite"/></rect>
<text x="403.6" y="394" font-size="11.5" class="mono dim">+0.13 pp, discarded (gain &lt;= 0.5)</text>
<rect x="850" y="380" width="80" height="20" rx="10" fill="none" stroke="#f87171" stroke-opacity="0.4"/><text x="890" y="394" font-size="11.5" text-anchor="middle" style="fill:#f87171" opacity="0.5">Low</text>
<text x="24" y="425" font-size="13" class="muted">Add achievements system</text>
<rect x="393.8" y="413" width="0" height="16" rx="3" fill="#24324f"><animate attributeName="width" values="0;0;1.5;1.5;0" keyTimes="0;0.325;0.375;0.93;1" dur="12s" repeatCount="indefinite"/></rect>
<text x="403.3" y="425" font-size="11.5" class="mono dim">+0.00 pp, discarded (gain &lt;= 0.5)</text>
<rect x="850" y="411" width="80" height="20" rx="10" fill="none" stroke="#f87171" stroke-opacity="0.4"/><text x="890" y="425" font-size="11.5" text-anchor="middle" style="fill:#f87171" opacity="0.5">Low</text>
<text x="24" y="456" font-size="13" class="muted">Add 30+ achievements</text>
<text x="401.8" y="456" font-size="11.5" class="mono dim">skipped: needs has_achievements</text>
<text x="24" y="487" font-size="13" class="muted">Add online co-op</text>
<text x="401.8" y="487" font-size="11.5" class="mono dim">skipped: needs cat_co_op</text>
<text x="24" y="547" font-size="12.5" class="muted">Confidence: High or Low only for the 5 features validated on the test split (does the model's mean predicted rank move</text>
<text x="24" y="565" font-size="12.5" class="muted">in the same direction as the median owners of games with vs without the feature?). Never-validated candidates default to Medium.</text>
</svg>
