<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" role="img">
<title>Training and inference pipeline</title>
<style>
  text { font-family: -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif; fill: #e6edf7; }
  .mono { font-family: ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
  .muted { fill: #8da2c0; }
  .dim { fill: #5b6b88; }
</style>
<defs><linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#131c35"/></linearGradient></defs>
<rect width="960" height="470" rx="18" fill="url(#bgGrad)"/>

<text x="24" y="40" font-size="20" font-weight="800">From raw data to a recommendation</text>
<text x="24" y="70" font-size="12.5" letter-spacing="1.5" style="fill:#38bdf8">TRAINING LANE  ·  when IntelligenceEngine is created (once per browser session, about 2 s)</text>
<text x="24" y="286" font-size="12.5" letter-spacing="1.5" style="fill:#fb923c">INFERENCE LANE  ·  every click on "Analyze Market Position"</text>
<path d="M190,138.0 L206,138.0" stroke="#24324f" stroke-width="2"/><path d="M199,133.0 L206,138.0 L199,143.0" fill="none" stroke="#8da2c0" stroke-width="2"/><path d="M376,138.0 L392,138.0" stroke="#24324f" stroke-width="2"/><path d="M385,133.0 L392,138.0 L385,143.0" fill="none" stroke="#8da2c0" stroke-width="2"/><path d="M562,138.0 L578,138.0" stroke="#24324f" stroke-width="2"/><path d="M571,133.0 L578,138.0 L571,143.0" fill="none" stroke="#8da2c0" stroke-width="2"/><path d="M748,138.0 L764,138.0" stroke="#24324f" stroke-width="2"/><path d="M757,133.0 L764,138.0 L757,143.0" fill="none" stroke="#8da2c0" stroke-width="2"/><path d="M190,346.0 L206,346.0" stroke="#24324f" stroke-width="2"/><path d="M199,341.0 L206,346.0 L199,351.0" fill="none" stroke="#8da2c0" stroke-width="2"/><path d="M376,346.0 L392,346.0" stroke="#24324f" stroke-width="2"/><path d="M385,341.0 L392,346.0 L385,351.0" fill="none" stroke="#8da2c0" stroke-width="2"/><path d="M562,346.0 L578,346.0" stroke="#24324f" stroke-width="2"/><path d="M571,341.0 L578,346.0 L571,351.0" fill="none" stroke="#8da2c0" stroke-width="2"/><path d="M748,346.0 L764,346.0" stroke="#24324f" stroke-width="2"/><path d="M757,341.0 L764,346.0 L757,351.0" fill="none" stroke="#8da2c0" stroke-width="2"/>
<circle r="5" fill="#38bdf8" opacity="0.9"><animateMotion dur="9s" begin="0.0s" repeatCount="indefinite" path="M106.0,138.0 L850.0,138.0"/></circle><circle r="5" fill="#38bdf8" opacity="0.9"><animateMotion dur="9s" begin="3.0s" repeatCount="indefinite" path="M106.0,138.0 L850.0,138.0"/></circle><circle r="5" fill="#38bdf8" opacity="0.9"><animateMotion dur="9s" begin="6.0s" repeatCount="indefinite" path="M106.0,138.0 L850.0,138.0"/></circle><circle r="5" fill="#fb923c" opacity="0.9"><animateMotion dur="9s" begin="4.5s" repeatCount="indefinite" path="M106.0,346.0 L850.0,346.0"/></circle><circle r="5" fill="#fb923c" opacity="0.9"><animateMotion dur="9s" begin="7.5s" repeatCount="indefinite" path="M106.0,346.0 L850.0,346.0"/></circle><circle r="5" fill="#fb923c" opacity="0.9"><animateMotion dur="9s" begin="10.5s" repeatCount="indefinite" path="M106.0,346.0 L850.0,346.0"/></circle>
<g>
  <rect x="24" y="92" width="164" height="92" rx="12" fill="#111a2e" stroke="#24324f"/>
  <rect x="24" y="92" width="164" height="92" rx="12" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0">
    <animate attributeName="opacity" values="0;1;0" dur="9s" begin="0.0s" repeatCount="indefinite" keyTimes="0;0.06;0.25"/>
  </rect>
  <rect x="36" y="106" width="6" height="22" rx="3" fill="#38bdf8"/>
  <text x="50" y="123" font-size="15" font-weight="700">steam.csv</text>
  <text x="38" y="150" font-size="12.5" class="muted">27,075 games</text>
  <text x="38" y="170" font-size="11.5" class="mono dim">18 raw columns</text>
</g>
<g>
  <rect x="210" y="92" width="164" height="92" rx="12" fill="#111a2e" stroke="#24324f"/>
  <rect x="210" y="92" width="164" height="92" rx="12" fill="none" stroke="#a78bfa" stroke-width="2" opacity="0">
    <animate attributeName="opacity" values="0;1;0" dur="9s" begin="0.9s" repeatCount="indefinite" keyTimes="0;0.06;0.25"/>
  </rect>
  <rect x="222" y="106" width="6" height="22" rx="3" fill="#a78bfa"/>
  <text x="236" y="123" font-size="15" font-weight="700">Feature engineering</text>
  <text x="224" y="150" font-size="12.5" class="muted">91 numeric columns</text>
  <text x="224" y="170" font-size="11.5" class="mono dim">_engineer_features()</text>
</g>
<g>
  <rect x="396" y="92" width="164" height="92" rx="12" fill="#111a2e" stroke="#24324f"/>
  <rect x="396" y="92" width="164" height="92" rx="12" fill="none" stroke="#f472b6" stroke-width="2" opacity="0">
    <animate attributeName="opacity" values="0;1;0" dur="9s" begin="1.8s" repeatCount="indefinite" keyTimes="0;0.06;0.25"/>
  </rect>
  <rect x="408" y="106" width="6" height="22" rx="3" fill="#f472b6"/>
  <text x="422" y="123" font-size="15" font-weight="700">Rank target</text>
  <text x="410" y="150" font-size="12.5" class="muted">rankdata(owners) / n</text>
  <text x="410" y="170" font-size="11.5" class="mono dim">ties share a rank</text>
</g>
<g>
  <rect x="582" y="92" width="164" height="92" rx="12" fill="#111a2e" stroke="#24324f"/>
  <rect x="582" y="92" width="164" height="92" rx="12" fill="none" stroke="#fbbf24" stroke-width="2" opacity="0">
    <animate attributeName="opacity" values="0;1;0" dur="9s" begin="2.7s" repeatCount="indefinite" keyTimes="0;0.06;0.25"/>
  </rect>
  <rect x="594" y="106" width="6" height="22" rx="3" fill="#fbbf24"/>
  <text x="608" y="123" font-size="15" font-weight="700">XGBoost fit</text>
  <text x="596" y="150" font-size="12.5" class="muted">21,660 games (80%)</text>
  <text x="596" y="170" font-size="11.5" class="mono dim">150 trees, depth 6</text>
</g>
<g>
  <rect x="768" y="92" width="164" height="92" rx="12" fill="#111a2e" stroke="#24324f"/>
  <rect x="768" y="92" width="164" height="92" rx="12" fill="none" stroke="#34d399" stroke-width="2" opacity="0">
    <animate attributeName="opacity" values="0;1;0" dur="9s" begin="3.6s" repeatCount="indefinite" keyTimes="0;0.06;0.25"/>
  </rect>
  <rect x="780" y="106" width="6" height="22" rx="3" fill="#34d399"/>
  <text x="794" y="123" font-size="15" font-weight="700">Reference set</text>
  <text x="782" y="150" font-size="12.5" class="muted">5,415 held-out scores</text>
  <text x="782" y="170" font-size="11.5" class="mono dim">+ feature sign check</text>
</g>
<g>
  <rect x="24" y="300" width="164" height="92" rx="12" fill="#111a2e" stroke="#24324f"/>
  <rect x="24" y="300" width="164" height="92" rx="12" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0">
    <animate attributeName="opacity" values="0;1;0" dur="9s" begin="4.5s" repeatCount="indefinite" keyTimes="0;0.06;0.25"/>
  </rect>
  <rect x="36" y="314" width="6" height="22" rx="3" fill="#38bdf8"/>
  <text x="50" y="331" font-size="15" font-weight="700">Your game</text>
  <text x="38" y="358" font-size="12.5" class="muted">Streamlit form</text>
  <text x="38" y="378" font-size="11.5" class="mono dim">new_game.py</text>
</g>
<g>
  <rect x="210" y="300" width="164" height="92" rx="12" fill="#111a2e" stroke="#24324f"/>
  <rect x="210" y="300" width="164" height="92" rx="12" fill="none" stroke="#a78bfa" stroke-width="2" opacity="0">
    <animate attributeName="opacity" values="0;1;0" dur="9s" begin="5.4s" repeatCount="indefinite" keyTimes="0;0.06;0.25"/>
  </rect>
  <rect x="222" y="314" width="6" height="22" rx="3" fill="#a78bfa"/>
  <text x="236" y="331" font-size="15" font-weight="700">Feature mapping</text>
  <text x="224" y="358" font-size="12.5" class="muted">form values to columns</text>
  <text x="224" y="378" font-size="11.5" class="mono dim">_build_ranker_features()</text>
</g>
<g>
  <rect x="396" y="300" width="164" height="92" rx="12" fill="#111a2e" stroke="#24324f"/>
  <rect x="396" y="300" width="164" height="92" rx="12" fill="none" stroke="#fbbf24" stroke-width="2" opacity="0">
    <animate attributeName="opacity" values="0;1;0" dur="9s" begin="6.3s" repeatCount="indefinite" keyTimes="0;0.06;0.25"/>
  </rect>
  <rect x="408" y="314" width="6" height="22" rx="3" fill="#fbbf24"/>
  <text x="422" y="331" font-size="15" font-weight="700">Rank score</text>
  <text x="410" y="358" font-size="12.5" class="muted">base + sum of 150 leaves</text>
  <text x="410" y="378" font-size="11.5" class="mono dim">_predict_rank()</text>
</g>
<g>
  <rect x="582" y="300" width="164" height="92" rx="12" fill="#111a2e" stroke="#24324f"/>
  <rect x="582" y="300" width="164" height="92" rx="12" fill="none" stroke="#34d399" stroke-width="2" opacity="0">
    <animate attributeName="opacity" values="0;1;0" dur="9s" begin="7.2s" repeatCount="indefinite" keyTimes="0;0.06;0.25"/>
  </rect>
  <rect x="594" y="314" width="6" height="22" rx="3" fill="#34d399"/>
  <text x="608" y="331" font-size="15" font-weight="700">Percentile</text>
  <text x="596" y="358" font-size="12.5" class="muted">searchsorted, clip 1..99</text>
  <text x="596" y="378" font-size="11.5" class="mono dim">get_percentile()</text>
</g>
<g>
  <rect x="768" y="300" width="164" height="92" rx="12" fill="#111a2e" stroke="#24324f"/>
  <rect x="768" y="300" width="164" height="92" rx="12" fill="none" stroke="#fb923c" stroke-width="2" opacity="0">
    <animate attributeName="opacity" values="0;1;0" dur="9s" begin="8.1s" repeatCount="indefinite" keyTimes="0;0.06;0.25"/>
  </rect>
  <rect x="780" y="314" width="6" height="22" rx="3" fill="#fb923c"/>
  <text x="794" y="331" font-size="15" font-weight="700">Decision layer</text>
  <text x="782" y="358" font-size="12.5" class="muted">13 what-ifs, tier, risks</text>
  <text x="782" y="378" font-size="11.5" class="mono dim">analyze_game()</text>
</g>

<path d="M664.0,184 C664.0,244 478.0,240 478.0,300" stroke="#fbbf24" stroke-width="2" stroke-dasharray="6 6" fill="none">
  <animate attributeName="stroke-dashoffset" from="0" to="-24" dur="1.2s" repeatCount="indefinite"/></path>
<text x="579.0" y="246.0" font-size="12" style="fill:#fbbf24">trained trees</text>
<path d="M850.0,184 C850.0,244 664.0,240 664.0,300" stroke="#34d399" stroke-width="2" stroke-dasharray="6 6" fill="none">
  <animate attributeName="stroke-dashoffset" from="0" to="-24" dur="1.2s" repeatCount="indefinite"/></path>
<text x="771.0" y="246.0" font-size="12" style="fill:#34d399">sorted reference scores</text>

<text x="24" y="430" font-size="12" class="muted">Secondary models (owners regression, review-ratio regression, Market Data tab) are trained separately by models.train_models(),</text>
<text x="24" y="448" font-size="12" class="muted">cached with st.cache_resource for the lifetime of the Streamlit server process (about 70 s on first launch).</text>

</svg>
