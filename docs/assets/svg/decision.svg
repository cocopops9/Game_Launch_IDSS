<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" width="960" height="330" role="img">
<title>Decision layer rules</title>
<style>
  text { font-family: -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif; fill: #e6edf7; }
  .mono { font-family: ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
  .muted { fill: #8da2c0; }
  .dim { fill: #5b6b88; }
</style>
<defs><linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#131c35"/></linearGradient></defs>
<rect width="960" height="330" rx="18" fill="url(#bgGrad)"/>
<text x="24" y="40" font-size="20" font-weight="800">Decision layer: deterministic rules on top of the percentile</text>
<text x="24" y="84" font-size="13" font-weight="700">Tier (intelligence_engine._compute_positioning)</text>
<rect x="24.0" y="110" width="81.2" height="28" rx="4" fill="#dc3545" opacity="0.8"/><text x="65.6" y="156" font-size="11" text-anchor="middle" class="muted">struggling</text><text x="24.0" y="174" font-size="10.5" text-anchor="middle" class="mono dim">0</text>
<rect x="107.2" y="110" width="81.2" height="28" rx="4" fill="#fd7e14" opacity="0.8"/><text x="148.8" y="156" font-size="11" text-anchor="middle" class="muted">below avg</text><text x="107.2" y="174" font-size="10.5" text-anchor="middle" class="mono dim">20</text>
<rect x="190.4" y="110" width="81.2" height="28" rx="4" fill="#ffc107" opacity="0.8"/><text x="232.0" y="156" font-size="11" text-anchor="middle" class="muted">average</text><text x="190.4" y="174" font-size="10.5" text-anchor="middle" class="mono dim">40</text>
<rect x="273.6" y="110" width="81.2" height="28" rx="4" fill="#17a2b8" opacity="0.8"/><text x="315.2" y="156" font-size="11" text-anchor="middle" class="muted">above avg</text><text x="273.6" y="174" font-size="10.5" text-anchor="middle" class="mono dim">60</text>
<rect x="356.8" y="110" width="60.4" height="28" rx="4" fill="#28a745" opacity="0.8"/><text x="388.0" y="156" font-size="11" text-anchor="middle" class="muted">strong</text><text x="356.8" y="174" font-size="10.5" text-anchor="middle" class="mono dim">80</text>
<rect x="419.2" y="110" width="18.8" height="28" rx="4" fill="#7ee2a8" opacity="0.8"/><text x="429.6" y="156" font-size="11" text-anchor="middle" class="muted">exc.</text><text x="419.2" y="174" font-size="10.5" text-anchor="middle" class="mono dim">95</text>
<text x="440.0" y="174" font-size="10.5" text-anchor="middle" class="mono dim">100</text>
<g><path d="M0,-12 L7,0 L-7,0 Z" fill="#e6edf7" transform="translate(218.3,108)"><animateTransform attributeName="transform" type="translate" dur="10s" repeatCount="indefinite" values="218.3,108;218.3,108;297.7,108;297.7,108;218.3,108" keyTimes="0;0.35;0.45;0.9;1"/></path></g>
<text x="24" y="206" font-size="12" class="muted">46.7 is "average"; after the top what-if, 65.8 is "above average".</text>
<text x="490" y="84" font-size="13" font-weight="700">Readiness score (success factors x 10, capped at 100)</text>
<rect x="490.0" y="110" width="166.0" height="28" rx="4" fill="#38bdf8" opacity="0"><animate attributeName="opacity" values="0;0;0.85;0.85;0" keyTimes="0;0.10;0.15;0.9;1" dur="10s" repeatCount="indefinite"/></rect><text x="574.0" y="129" font-size="12" text-anchor="middle" font-weight="700">+30</text><text x="574.0" y="156" font-size="10.5" text-anchor="middle" class="muted">Multi-platform (2+ OS)</text>
<rect x="658.0" y="110" width="110.0" height="28" rx="4" fill="#a78bfa" opacity="0"><animate attributeName="opacity" values="0;0;0.85;0.85;0" keyTimes="0;0.22;0.27;0.9;1" dur="10s" repeatCount="indefinite"/></rect><text x="714.0" y="129" font-size="12" text-anchor="middle" font-weight="700">+20</text><text x="714.0" y="156" font-size="10.5" text-anchor="middle" class="muted">Achievements > 0</text>
<rect x="770.0" y="110" width="110.0" height="28" rx="4" fill="#fbbf24" opacity="0"><animate attributeName="opacity" values="0;0;0.85;0.85;0" keyTimes="0;0.34;0.39;0.9;1" dur="10s" repeatCount="indefinite"/></rect><text x="826.0" y="129" font-size="12" text-anchor="middle" font-weight="700">+20</text><text x="826.0" y="156" font-size="10.5" text-anchor="middle" class="muted">Steam Trading Cards</text>
<text x="890.0" y="129" font-size="12" class="mono dim">max 70</text>
<text x="490" y="188" font-size="12" class="muted">The three factors weigh 3, 2 and 2 points; the score can never exceed 70%.</text>
<text x="24" y="240" font-size="13" font-weight="700">Risk rules (intelligence_engine._assess_risks)</text>
<rect x="24" y="254" width="296" height="52" rx="10" fill="#111a2e" stroke="#24324f"/><text x="38" y="276" font-size="12.5" class="mono">if exactly 1 platform</text><text x="38" y="296" font-size="12" style="fill:#fbbf24">moderate: Limited Platform Support</text>
<rect x="334" y="254" width="296" height="52" rx="10" fill="#111a2e" stroke="#24324f"/><text x="348" y="276" font-size="12.5" class="mono">if price > $40</text><text x="348" y="296" font-size="12" style="fill:#f87171">high: Premium Pricing Risk</text>
<rect x="644" y="254" width="296" height="52" rx="10" fill="#111a2e" stroke="#24324f"/><text x="658" y="276" font-size="12.5" class="mono">if percentile &lt; 30</text><text x="658" y="296" font-size="12" style="fill:#f87171">high: Below-Average Position</text>
</svg>
