<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img">
<title>Percentile mapping</title>
<style>
  text { font-family: -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif; fill: #e6edf7; }
  .mono { font-family: ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
  .muted { fill: #8da2c0; }
  .dim { fill: #5b6b88; }
</style>
<defs><linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#131c35"/></linearGradient></defs>
<rect width="960" height="420" rx="18" fill="url(#bgGrad)"/>
<text x="24" y="40" font-size="20" font-weight="800">Score to percentile: position inside 5,415 held-out scores</text>
<text x="24" y="62" font-size="13" class="muted">percentile = searchsorted(sorted_reference, score) / 5,415 * 100, then clipped to [1, 99].</text>
<rect x="90" y="80" width="550" height="250" fill="#111a2e" rx="8"/>
