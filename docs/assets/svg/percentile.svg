<line x1="90" y1="267.5" x2="640" y2="267.5" stroke="#24324f"/><text x="82" y="271.5" font-size="11" text-anchor="end" class="mono muted">25</text>
<line x1="90" y1="205.0" x2="640" y2="205.0" stroke="#24324f"/><text x="82" y="209.0" font-size="11" text-anchor="end" class="mono muted">50</text>
<line x1="90" y1="142.5" x2="640" y2="142.5" stroke="#24324f"/><text x="82" y="146.5" font-size="11" text-anchor="end" class="mono muted">75</text>
<line x1="90" y1="80.0" x2="640" y2="80.0" stroke="#24324f"/><text x="82" y="84.0" font-size="11" text-anchor="end" class="mono muted">100</text>
<text x="137.3" y="348" font-size="11" text-anchor="middle" class="mono muted">0.3</text>
<text x="255.6" y="348" font-size="11" text-anchor="middle" class="mono muted">0.5</text>
<text x="373.9" y="348" font-size="11" text-anchor="middle" class="mono muted">0.7</text>
<text x="492.2" y="348" font-size="11" text-anchor="middle" class="mono muted">0.9</text>
<text x="610.4" y="348" font-size="11" text-anchor="middle" class="mono muted">1.1</text>
<text x="365.0" y="368" font-size="12" text-anchor="middle" class="muted">raw rank score from the 150 trees</text>
