<text x="350.2" y="255.0" font-size="11.5" class="muted">steep rise at 0.33 to 0.36: thousands of</text>
<text x="350.2" y="272.5" font-size="11.5" class="muted">near-identical scores of small games</text>
<path d="M198.2,330 L198.2,213.2 L90,213.2" stroke="#38bdf8" stroke-width="2.2" fill="none" stroke-dasharray="900" stroke-dashoffset="900"><animate attributeName="stroke-dashoffset" dur="12s" repeatCount="indefinite" keyTimes="0;0.02;0.14;0.26;0.44;0.46;1" values="900;900;560;0;0;900;900"/></path><g opacity="0"><circle cx="198.2" cy="213.2" r="6" fill="#38bdf8"/><text x="100" y="205.2" font-size="14" font-weight="700" style="fill:#38bdf8">46.7th</text><text x="208.2" y="320" font-size="12" class="mono" style="fill:#38bdf8">score 0.403</text><animate attributeName="opacity" dur="12s" repeatCount="indefinite" keyTimes="0;0.24;0.26;0.44;0.46;1" values="0;0;1;1;0;0"/></g><g opacity="0"><text x="680" y="150" font-size="14" font-weight="700" style="fill:#38bdf8">default form values</text><animate attributeName="opacity" dur="12s" repeatCount="indefinite" keyTimes="0;0.02;0.04;0.44;0.46;1" values="0;0;1;1;0;0"/></g>
<path d="M272.9,330 L272.9,165.5 L90,165.5" stroke="#34d399" stroke-width="2.2" fill="none" stroke-dasharray="900" stroke-dashoffset="900"><animate attributeName="stroke-dashoffset" dur="12s" repeatCount="indefinite" keyTimes="0;0.50;0.62;0.74;0.92;0.94;1" values="900;900;560;0;0;900;900"/></path><g opacity="0"><circle cx="272.9" cy="165.5" r="6" fill="#34d399"/><text x="100" y="157.5" font-size="14" font-weight="700" style="fill:#34d399">65.8th</text><text x="282.9" y="320" font-size="12" class="mono" style="fill:#34d399">score 0.529</text><animate attributeName="opacity" dur="12s" repeatCount="indefinite" keyTimes="0;0.72;0.74;0.92;0.94;1" values="0;0;1;1;0;0"/></g><g opacity="0"><text x="680" y="150" font-size="14" font-weight="700" style="fill:#34d399">+ tag_multiplayer = 1</text><animate attributeName="opacity" dur="12s" repeatCount="indefinite" keyTimes="0;0.50;0.52;0.92;0.94;1" values="0;0;1;1;0;0"/></g>
<text x="680" y="110" font-size="12" class="dim">reading the curve:</text>
<text x="680" y="230" font-size="13" font-weight="700">Why a reference set?</text>
<text x="680" y="252" font-size="12" class="muted">A raw score has no business meaning.</text>
<text x="680" y="269" font-size="12" class="muted">Comparing it with the model's own</text>
<text x="680" y="286" font-size="12" class="muted">predictions for 5,415 real held-out</text>
<text x="680" y="303" font-size="12" class="muted">games turns it into a market position,</text>
<text x="680" y="320" font-size="12" class="muted">and cancels any constant bias of the model.</text>
<text x="680" y="337" font-size="12" class="muted"></text>
<text x="680" y="354" font-size="12" class="muted">Red bands: values below 1 or above 99</text>
<text x="680" y="371" font-size="12" class="muted">are clipped to 1 and 99.</text>
</svg>
